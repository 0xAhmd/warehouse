<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warehouse OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>
/* ═══════════════════════════════════════════════════════
   DESIGN SYSTEM — CSS VARIABLES
═══════════════════════════════════════════════════════ */
:root {
  /* Palette */
  --base:          #F2F4F6;
  --base-warm:     #F7F5F2;
  --surface:       #FFFFFF;
  --surface-2:     #F7F8FA;
  --border:        #DDE1E7;
  --border-subtle: #ECEEF2;

  --primary:       #1C2B3A;
  --primary-mid:   #2E4156;
  --primary-light: #4A6580;
  --primary-muted: #7A91A6;
  --primary-ghost: #EBF0F5;

  --accent:        #2A7F6F;
  --accent-light:  #3BA392;
  --accent-muted:  #EAF4F2;
  --accent-dark:   #1D6058;

  --danger:        #B94040;
  --danger-muted:  #F8ECEC;
  --danger-light:  #D16060;

  --warning:       #A0742A;
  --warning-muted: #FBF3E4;
  --warning-light: #C49040;

  --success:       #2E7257;
  --success-muted: #EAF4EE;
  --success-light: #3D9470;

  --info:          #2A5F8A;
  --info-muted:    #EAF0F8;

  /* Typography */
  --font-display: 'Fraunces', Georgia, serif;
  --font-body:    'Jost', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', 'Courier New', monospace;

  /* Spacing */
  --sidebar-w:    220px;
  --sidebar-collapsed: 64px;
  --content-pad:  32px;

  /* Shadows */
  --shadow-xs:    0 1px 2px rgba(28, 43, 58, 0.06);
  --shadow-sm:    0 1px 3px rgba(28, 43, 58, 0.08);
  --shadow-md:    0 2px 6px rgba(28, 43, 58, 0.08);

  /* Radius */
  --radius-sm:    4px;
  --radius:       6px;
  --radius-lg:    8px;
  --radius-pill:  999px;

  /* Transitions */
  --transition:   150ms ease;
  --transition-md: 220ms ease;
}

/* ═══════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }

html { font-size: 14px; }

body {
  font-family: var(--font-body);
  font-weight: 400;
  color: var(--primary);
  background: var(--base);
  margin: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.5;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.2;
  color: var(--primary);
}

code, .mono {
  font-family: var(--font-mono);
  font-size: 0.88em;
}

/* ═══════════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════════ */
#app {
  display: flex;
  min-height: 100vh;
}

/* ═══════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--primary);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 100;
  transition: width var(--transition-md);
}

.sidebar-logo {
  padding: 22px 20px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.sidebar-logo-mark {
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.sidebar-logo-mark svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: white;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.sidebar-logo-text {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.05rem;
  color: white;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.sidebar-logo-sub {
  font-family: var(--font-body);
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--primary-muted);
  display: block;
  line-height: 1;
  margin-top: 1px;
}

.nav-section-label {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--primary-muted);
  padding: 18px 20px 6px;
  display: block;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
  color: #A8B8C8;
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 400;
  border-radius: 0;
  transition: background var(--transition), color var(--transition);
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  white-space: nowrap;
  position: relative;
}

.nav-link:hover {
  background: rgba(255,255,255,0.06);
  color: white;
}

.nav-link.active {
  background: rgba(42, 127, 111, 0.2);
  color: #6ECFBF;
  font-weight: 500;
}

.nav-link.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 6px;
  width: 3px;
  background: var(--accent-light);
  border-radius: 0 3px 3px 0;
}

.nav-link svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  opacity: 0.7;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: opacity var(--transition);
}

.nav-link:hover svg,
.nav-link.active svg {
  opacity: 1;
}

.sidebar-footer {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.sidebar-user {
  font-size: 0.75rem;
  color: var(--primary-muted);
  margin-bottom: 10px;
}

.sidebar-user strong {
  display: block;
  color: #A8B8C8;
  font-weight: 500;
  font-size: 0.8rem;
  margin-bottom: 1px;
}

.sidebar-role-badge {
  display: inline-block;
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: var(--radius-pill);
  background: var(--accent-dark);
  color: #9EE4D8;
  margin-top: 2px;
}

.sidebar-role-badge.viewer {
  background: rgba(120, 145, 166, 0.25);
  color: var(--primary-muted);
}

/* ═══════════════════════════════════════════════════════
   MAIN CONTENT
═══════════════════════════════════════════════════════ */
#content {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  padding: var(--content-pad);
  transition: margin-left var(--transition-md);
}

.page-header {
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}

.page-title {
  font-family: var(--font-display);
  font-size: 1.75rem;
  font-weight: 400;
  color: var(--primary);
  margin: 0;
  letter-spacing: -0.02em;
}

.page-subtitle {
  font-size: 0.8rem;
  color: var(--primary-muted);
  margin-top: 3px;
  font-weight: 400;
}

/* ═══════════════════════════════════════════════════════
   CARDS
═══════════════════════════════════════════════════════ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 0;
}

.card-header-custom {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--primary-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-body-custom {
  padding: 20px;
}

/* ═══════════════════════════════════════════════════════
   FORMS
═══════════════════════════════════════════════════════ */
.form-wrap {
  max-width: 500px;
}

.form-label {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--primary-light);
  margin-bottom: 5px;
  display: block;
}

.form-control,
.form-select {
  font-family: var(--font-body);
  font-size: 0.875rem;
  color: var(--primary);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  transition: border-color var(--transition), box-shadow var(--transition);
  height: auto;
  box-shadow: none;
}

.form-control:focus,
.form-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(42, 127, 111, 0.12);
  background: var(--surface);
  color: var(--primary);
}

.form-control::placeholder {
  color: var(--primary-muted);
}

.form-control.is-invalid {
  border-color: var(--danger-light);
  box-shadow: 0 0 0 3px rgba(185, 64, 64, 0.1);
}

.invalid-feedback {
  font-size: 0.75rem;
  color: var(--danger);
  margin-top: 4px;
}

/* ═══════════════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════════════ */
.btn {
  font-family: var(--font-body);
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  border-radius: var(--radius);
  padding: 7px 16px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  text-decoration: none;
  line-height: 1.4;
}

.btn:focus {
  outline: none;
  box-shadow: 0 0 0 3px rgba(42, 127, 111, 0.2);
}

.btn-primary {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.btn-primary:hover {
  background: var(--primary-mid);
  border-color: var(--primary-mid);
  color: white;
}

.btn-accent {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.btn-accent:hover {
  background: var(--accent-dark);
  border-color: var(--accent-dark);
  color: white;
}

.btn-outline {
  background: transparent;
  color: var(--primary);
  border-color: var(--border);
}
.btn-outline:hover {
  background: var(--surface-2);
  border-color: var(--primary-muted);
  color: var(--primary);
}

.btn-outline-accent {
  background: transparent;
  color: var(--accent);
  border-color: var(--accent);
}
.btn-outline-accent:hover {
  background: var(--accent-muted);
  color: var(--accent-dark);
}

.btn-danger-outline {
  background: transparent;
  color: var(--danger);
  border-color: rgba(185, 64, 64, 0.4);
}
.btn-danger-outline:hover {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}

.btn-warning-outline {
  background: transparent;
  color: var(--warning);
  border-color: rgba(160, 116, 42, 0.4);
}
.btn-warning-outline:hover {
  background: var(--warning);
  color: white;
  border-color: var(--warning);
}

.btn-ghost {
  background: transparent;
  color: var(--primary-light);
  border-color: transparent;
}
.btn-ghost:hover {
  background: var(--surface-2);
  color: var(--primary);
  border-color: var(--border);
}

.btn-sm {
  font-size: 0.75rem;
  padding: 4px 10px;
  gap: 4px;
}

.btn-lg {
  font-size: 0.9rem;
  padding: 10px 22px;
}

/* ═══════════════════════════════════════════════════════
   TABLES
═══════════════════════════════════════════════════════ */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.835rem;
}

.data-table thead th {
  font-family: var(--font-body);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--primary-light);
  padding: 10px 14px;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
  background: var(--surface-2);
  text-align: left;
}

.data-table thead th.num {
  text-align: right;
}

.data-table tbody tr {
  border-bottom: 1px solid var(--border-subtle);
  transition: background var(--transition);
}

.data-table tbody tr:hover {
  background: var(--primary-ghost);
}

.data-table tbody tr:last-child {
  border-bottom: none;
}

.data-table td {
  padding: 9px 14px;
  color: var(--primary);
  vertical-align: middle;
}

.data-table td.num {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 0.82rem;
}

.data-table td.sku-cell {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--primary-light);
}

.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.table-wrap .data-table thead th:first-child {
  border-radius: 0;
}

/* ═══════════════════════════════════════════════════════
   STATUS BADGES
═══════════════════════════════════════════════════════ */
.badge {
  display: inline-flex;
  align-items: center;
  font-family: var(--font-body);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  white-space: nowrap;
  gap: 4px;
}

.badge-success {
  background: var(--success-muted);
  color: var(--success);
}

.badge-danger {
  background: var(--danger-muted);
  color: var(--danger);
}

.badge-warning {
  background: var(--warning-muted);
  color: var(--warning);
}

.badge-info {
  background: var(--info-muted);
  color: var(--info);
}

.badge-neutral {
  background: var(--primary-ghost);
  color: var(--primary-light);
}

.badge-accent {
  background: var(--accent-muted);
  color: var(--accent-dark);
}

/* Quantity display */
.qty-display {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 500;
}

.qty-good    { color: var(--success); }
.qty-low     { color: var(--warning); }
.qty-zero    { color: var(--danger); }
.qty-faulty  { color: var(--danger); }

/* ═══════════════════════════════════════════════════════
   TOAST NOTIFICATIONS
═══════════════════════════════════════════════════════ */
#toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast-msg {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 11px 16px;
  font-size: 0.82rem;
  color: var(--primary);
  box-shadow: var(--shadow-md);
  pointer-events: all;
  max-width: 320px;
  animation: toastIn 0.22s ease forwards;
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast-msg.toast-error {
  border-left-color: var(--danger);
}

.toast-msg.toast-warning {
  border-left-color: var(--warning);
}

.toast-msg.toast-out {
  animation: toastOut 0.22s ease forwards;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(16px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(16px); }
}

/* ═══════════════════════════════════════════════════════
   LOGIN PAGE
═══════════════════════════════════════════════════════ */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary);
  padding: 20px;
}

.login-card {
  background: var(--surface);
  border-radius: 10px;
  width: 380px;
  max-width: 100%;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
  overflow: hidden;
}

.login-header {
  padding: 32px 32px 24px;
  border-bottom: 1px solid var(--border-subtle);
}

.login-logo-mark {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}

.login-logo-mark svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: white;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.login-title {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 400;
  color: var(--primary);
  margin: 0 0 4px;
  letter-spacing: -0.02em;
}

.login-subtitle {
  font-size: 0.8rem;
  color: var(--primary-muted);
  margin: 0;
}

.login-body {
  padding: 28px 32px 32px;
}

.login-error {
  background: var(--danger-muted);
  border: 1px solid rgba(185, 64, 64, 0.2);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 0.8rem;
  color: var(--danger);
  margin-bottom: 18px;
  display: none;
}

/* ═══════════════════════════════════════════════════════
   EMPTY STATES
═══════════════════════════════════════════════════════ */
.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--primary-muted);
  font-size: 0.82rem;
}

.empty-state-title {
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--primary-light);
  margin-bottom: 4px;
  font-weight: 400;
}

/* ═══════════════════════════════════════════════════════
   TOOLBAR / SEARCH BAR
═══════════════════════════════════════════════════════ */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}

.search-box svg {
  position: absolute;
  left: 10px;
  width: 14px;
  height: 14px;
  stroke: var(--primary-muted);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  pointer-events: none;
}

.search-box .form-control {
  padding-left: 32px;
}

/* ═══════════════════════════════════════════════════════
   SECTION DIVIDER
═══════════════════════════════════════════════════════ */
.section-divider {
  margin: 28px 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-label {
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--primary-light);
  white-space: nowrap;
}

.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ═══════════════════════════════════════════════════════
   TWO-PANEL LAYOUT
═══════════════════════════════════════════════════════ */
.panel-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  max-width: 860px;
  margin-bottom: 28px;
}

@media (max-width: 760px) {
  .panel-grid { grid-template-columns: 1fr; }
}

/* ═══════════════════════════════════════════════════════
   INLINE FORM PANEL (for Replace page)
═══════════════════════════════════════════════════════ */
.inline-return-form {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* ═══════════════════════════════════════════════════════
   STATS ROW (Reports)
═══════════════════════════════════════════════════════ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  box-shadow: var(--shadow-xs);
}

.stat-label {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--primary-muted);
  margin-bottom: 6px;
}

.stat-value {
  font-family: var(--font-mono);
  font-size: 1.5rem;
  font-weight: 500;
  color: var(--primary);
  line-height: 1;
}

.stat-value.accent { color: var(--accent); }
.stat-value.danger { color: var(--danger); }
.stat-value.warning { color: var(--warning); }

/* ═══════════════════════════════════════════════════════
   LOADING SKELETON
═══════════════════════════════════════════════════════ */
.skeleton-line {
  height: 12px;
  background: linear-gradient(90deg, var(--border-subtle) 25%, var(--border) 50%, var(--border-subtle) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.4s ease infinite;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}

@keyframes skeleton-shimmer {
  from { background-position: 200% 0; }
  to   { background-position: -200% 0; }
}

/* ═══════════════════════════════════════════════════════
   UPLOAD ZONE
═══════════════════════════════════════════════════════ */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  background: var(--surface);
}

.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--accent);
  background: var(--accent-muted);
}

.upload-zone-title {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 400;
  color: var(--primary);
  margin-bottom: 4px;
}

.upload-zone-sub {
  font-size: 0.78rem;
  color: var(--primary-muted);
}

/* ═══════════════════════════════════════════════════════
   PRODUCT FORM MODAL-STYLE
═══════════════════════════════════════════════════════ */
#product-form-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 0;
  max-width: 500px;
  margin-bottom: 20px;
  overflow: hidden;
}

/* ═══════════════════════════════════════════════════════
   UTILITY OVERRIDES
═══════════════════════════════════════════════════════ */
.d-none { display: none !important; }
.mt-auto { margin-top: auto; }
.ms-auto { margin-left: auto; }
.text-muted { color: var(--primary-muted) !important; }
.text-danger { color: var(--danger) !important; }
.text-success { color: var(--success) !important; }
.text-warning { color: var(--warning) !important; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.fw-500 { font-weight: 500; }
.font-mono { font-family: var(--font-mono); }

/* Bootstrap overrides */
.alert {
  border-radius: var(--radius);
  font-size: 0.82rem;
  border: 1px solid transparent;
  padding: 10px 14px;
}
.alert-success { background: var(--success-muted); color: var(--success); border-color: rgba(46,114,87,0.2); }
.alert-danger  { background: var(--danger-muted);  color: var(--danger);  border-color: rgba(185,64,64,0.2); }
.alert-warning { background: var(--warning-muted); color: var(--warning); border-color: rgba(160,116,42,0.2); }
.alert-info    { background: var(--info-muted);    color: var(--info);    border-color: rgba(42,95,138,0.2); }

/* ═══════════════════════════════════════════════════════
   PRINT STYLES
═══════════════════════════════════════════════════════ */
@media print {
  .sidebar, .no-print, #toast-container {
    display: none !important;
  }
  #content {
    margin-left: 0 !important;
    padding: 0 !important;
  }
  .table-wrap {
    box-shadow: none !important;
    border: 1px solid #ccc !important;
  }
  .page-header {
    padding-bottom: 10px !important;
    margin-bottom: 16px !important;
  }
}

/* ═══════════════════════════════════════════════════════
   MOBILE
═══════════════════════════════════════════════════════ */
@media (max-width: 768px) {
  :root {
    --content-pad: 16px;
    --sidebar-w: 0px;
  }

  .sidebar {
    transform: translateX(-100%);
    width: var(--sidebar-collapsed);
    transition: transform 0.25s ease, width 0.25s ease;
  }

  .sidebar.open {
    transform: translateX(0);
    width: 220px;
  }

  #content {
    margin-left: 0;
    padding-top: 60px;
  }

  .mobile-topbar {
    display: flex !important;
  }

  .panel-grid {
    grid-template-columns: 1fr;
  }

  .page-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .stats-row {
    grid-template-columns: 1fr 1fr;
  }
}

.mobile-topbar {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: var(--primary);
  z-index: 99;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
}

.mobile-menu-btn {
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mobile-topbar-title {
  font-family: var(--font-display);
  font-size: 1rem;
  color: white;
  font-weight: 400;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 99;
}

.sidebar-overlay.show {
  display: block;
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     LOGIN SCREEN
═══════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo-mark">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
      </div>
      <h1 class="login-title">Warehouse OS</h1>
      <p class="login-subtitle">Inventory &amp; Operations Platform</p>
    </div>
    <div class="login-body">
      <div id="login-error" class="login-error"></div>
      <div class="mb-3">
        <label class="form-label" for="login-email">Email Address</label>
        <input id="login-email" type="email" class="form-control" placeholder="admin@warehouse.local" autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label" for="login-pass">Password</label>
        <input id="login-pass" type="password" class="form-control" placeholder="Enter password" autocomplete="current-password">
      </div>
      <button id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center;">
        <span id="login-btn-text">Sign In</span>
        <span id="login-spinner" class="d-none" style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite"></span>
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════
     MOBILE TOPBAR
═══════════════════════════════════════════════════ -->
<div class="mobile-topbar">
  <button class="mobile-menu-btn" id="mobile-menu-btn">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <span class="mobile-topbar-title">Warehouse OS</span>
</div>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- ═══════════════════════════════════════════════════
     MAIN APP
═══════════════════════════════════════════════════ -->
<div id="app" class="d-none">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
      </div>
      <div>
        <div class="sidebar-logo-text">Warehouse OS</div>
        <span class="sidebar-logo-sub">Management</span>
      </div>
    </div>

    <span class="nav-section-label">Inventory</span>
    <a class="nav-link" data-page="products">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      Products
    </a>
    <a class="nav-link" data-page="stock-in">

      Stock Out
    </a>

    <span class="nav-section-label">Operations</span>
    <a class="nav-link" data-page="faulty">
      <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Faulty Items
    </a>
    <a class="nav-link" data-page="replace">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      Replace / Return
    </a>

    <span class="nav-section-label">Reports</span>
    <a class="nav-link" data-page="reports">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Reports
    </a>

    <span class="nav-section-label" id="admin-nav-label">Admin</span>
    <a class="nav-link admin-only" data-page="import">
      <svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.83"/></svg>
      Import CSV / XLSX
    </a>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <strong id="user-name-display">—</strong>
        <span id="user-role-badge" class="sidebar-role-badge">admin</span>
      </div>
      <button id="logout-btn" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;color:#A8B8C8;border-color:rgba(255,255,255,0.12);">
        Sign Out
      </button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main id="content"></main>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';

// ══════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════
const STATE = {
  token: localStorage.getItem('wh_token'),
  user: null,
  currentPage: null,
};

// ══════════════════════════════════════════════════════
//  API LAYER
// ══════════════════════════════════════════════════════
async function api(method, path, data = null, isForm = false) {
  const opts = {
    method,
    headers: { Authorization: `Bearer ${STATE.token}` },
  };
  if (data && !isForm) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(data);
  }
  if (data && isForm) opts.body = data;

  const r = await fetch('/warehouse/api/' + path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

// ══════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast-msg${type === 'error' || type === 'danger' ? ' toast-error' : type === 'warning' ? ' toast-warning' : ''}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => {
    el.classList.add('toast-out');
    setTimeout(() => el.remove(), 240);
  }, 3200);
}

// ══════════════════════════════════════════════════════
//  HTML HELPERS
// ══════════════════════════════════════════════════════
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function qtyClass(n) {
  n = parseInt(n) || 0;
  if (n === 0) return 'qty-zero';
  if (n < 5)   return 'qty-low';
  return 'qty-good';
}

function fmtDate(d) {
  if (!d) return '—';
  return d.replace('T', ' ').substring(0, 16);
}

function fmtPrice(p) {
  return parseFloat(p || 0).toFixed(2);
}

// ══════════════════════════════════════════════════════
//  ROUTER
// ══════════════════════════════════════════════════════
const PAGES = {};
function register(name, fn) { PAGES[name] = fn; }

function navigate(page) {
  STATE.currentPage = page;
  document.querySelectorAll('.nav-link').forEach(a =>
    a.classList.toggle('active', a.dataset.page === page)
  );
  const el = document.getElementById('content');
  el.innerHTML = `<div style="padding:20px;color:var(--primary-muted);font-size:0.82rem">Loading…</div>`;
  closeSidebar();
  if (PAGES[page]) PAGES[page]();
}

function c() { return document.getElementById('content'); }
const isAdmin = () => STATE.user?.role === 'admin';

// ══════════════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════════════
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const btnTxt = document.getElementById('login-btn-text');
  const spinner = document.getElementById('login-spinner');

  errEl.style.display = 'none';
  if (!email || !pass) {
    errEl.textContent = 'Please enter your email and password.';
    errEl.style.display = 'block';
    return;
  }

  btnTxt.textContent = 'Signing in…';
  spinner.classList.remove('d-none');
  document.getElementById('login-btn').disabled = true;

  try {
    const r = await api('POST', 'auth/login', { email, password: pass });
    STATE.token = r.token;
    STATE.user = r.user;
    localStorage.setItem('wh_token', r.token);
    bootApp();
  } catch(e) {
    errEl.textContent = e.message || 'Login failed. Please check your credentials.';
    errEl.style.display = 'block';
  } finally {
    btnTxt.textContent = 'Sign In';
    spinner.classList.add('d-none');
    document.getElementById('login-btn').disabled = false;
  }
}

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('wh_token');
  STATE.token = null;
  STATE.user = null;
  document.getElementById('app').classList.add('d-none');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-error').style.display = 'none';
});

function bootApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.remove('d-none');
  document.getElementById('user-name-display').textContent = STATE.user.name;
  const roleBadge = document.getElementById('user-role-badge');
  roleBadge.textContent = STATE.user.role;
  roleBadge.className = `sidebar-role-badge${STATE.user.role !== 'admin' ? ' viewer' : ''}`;

  // Hide admin-only nav items for viewers
  document.querySelectorAll('.admin-only, #admin-nav-label').forEach(el => {
    el.style.display = isAdmin() ? '' : 'none';
  });

  // Wire up nav links
  document.querySelectorAll('.nav-link[data-page]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      navigate(a.dataset.page);
    });
  });

  navigate('products');
}

// Auto-login from stored token
if (STATE.token) {
  try {
    const parts = STATE.token.split('.');
    const payload = JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
    if (payload.exp > Date.now() / 1000) {
      STATE.user = { id: payload.sub, name: payload.name, role: payload.role };
      bootApp();
    } else {
      localStorage.removeItem('wh_token');
      STATE.token = null;
    }
  } catch(e) {
    localStorage.removeItem('wh_token');
    STATE.token = null;
  }
}

// ══════════════════════════════════════════════════════
//  MOBILE SIDEBAR
// ══════════════════════════════════════════════════════
document.getElementById('mobile-menu-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
});

document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

// ══════════════════════════════════════════════════════
//  PAGE: PRODUCTS
// ══════════════════════════════════════════════════════
register('products', () => {
  c().innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Products</h1>
        <p class="page-subtitle">Product catalog and inventory levels</p>
      </div>
      ${isAdmin() ? `<button class="btn btn-accent no-print" onclick="showProductForm()">Add Product</button>` : ''}
    </div>

    <div id="product-form-wrap" class="d-none no-print">
      <div class="card-header-custom">
        <span id="pf-title">New Product</span>
        <button class="btn btn-ghost btn-sm" onclick="hideProductForm()">Close</button>
      </div>
      <div class="card-body-custom">
        <div class="form-wrap">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" class="mb-3">
            <div>
              <label class="form-label">SKU</label>
              <input id="f-sku" class="form-control font-mono" placeholder="Optional">
              <div class="invalid-feedback" id="err-sku"></div>
            </div>
            <div>
              <label class="form-label">Product Name *</label>
              <input id="f-name" class="form-control" placeholder="e.g. Hydraulic Valve 10mm">
              <div class="invalid-feedback" id="err-name"></div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" class="mb-4">
            <div>
              <label class="form-label">Price</label>
              <input id="f-price" type="number" step="0.01" min="0" class="form-control" placeholder="0.00">
              <div class="invalid-feedback" id="err-price"></div>
            </div>
            <div>
              <label class="form-label">Initial Quantity</label>
              <input id="f-qty" type="number" min="0" class="form-control" placeholder="0">
              <div class="invalid-feedback" id="err-qty"></div>
            </div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" onclick="saveProduct()">
              <span id="pf-save-text">Save Product</span>
            </button>
            <button class="btn btn-outline" onclick="hideProductForm()">Cancel</button>
          </div>
          <input type="hidden" id="f-id">
        </div>
      </div>
    </div>

    <div class="toolbar no-print">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" class="form-control" style="min-width:260px" placeholder="Search by name or SKU…">
      </div>
      <button class="btn btn-outline" onclick="loadProducts()">Search</button>
    </div>

    <div id="product-table-wrap">
      <div class="table-wrap">
        ${skeletonTable(7, 6)}
      </div>
    </div>`;

  document.getElementById('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadProducts();
  });

  loadProducts();
});

function skeletonTable(cols, rows) {
  const cells = Array(cols).fill('<td><div class="skeleton-line" style="width:80%"></div></td>').join('');
  const trs = Array(rows).fill(`<tr>${cells}</tr>`).join('');
  return `<table class="data-table"><tbody>${trs}</tbody></table>`;
}

async function loadProducts() {
  const q = (document.getElementById('q')?.value || '').trim();
  const wrap = document.getElementById('product-table-wrap');
  if (!wrap) return;

  try {
    const r = await api('GET', 'products' + (q ? `?q=${encodeURIComponent(q)}` : ''));
    const data = r.data || [];

    if (data.length === 0) {
      wrap.innerHTML = `<div class="table-wrap"><div class="empty-state">
        <div class="empty-state-title">No products found</div>
        <div>${q ? `No results for "${esc(q)}"` : 'Add your first product to get started.'}</div>
      </div></div>`;
      return;
    }

    const rows = data.map((p, i) => {
      const qty = parseInt(p.quantity) || 0;
      const fq = parseInt(p.faulty_quantity) || 0;
      return `<tr>
        <td class="sku-cell">${esc(p.sku || '—')}</td>
        <td style="font-weight:500">${esc(p.name)}</td>
        <td class="num">${fmtPrice(p.price)}</td>
        <td class="num"><span class="qty-display ${qtyClass(qty)}">${qty}</span></td>
        <td class="num">${fq > 0 ? `<span class="qty-display qty-faulty">${fq}</span>` : `<span class="qty-display" style="color:var(--primary-muted)">0</span>`}</td>

function showProductForm(p = null) {
  const wrap = document.getElementById('product-form-wrap');
  wrap.classList.remove('d-none');
  document.getElementById('pf-title').textContent = p ? 'Edit Product' : 'New Product';
  document.getElementById('pf-save-text').textContent = p ? 'Update Product' : 'Save Product';
  document.getElementById('f-id').value = p?.id ?? '';
  document.getElementById('f-sku').value = p?.sku ?? '';
  document.getElementById('f-name').value = p?.name ?? '';
  document.getElementById('f-price').value = p?.price ?? '';
  document.getElementById('f-qty').value = p?.quantity ?? '';
  clearFormErrors('f-sku', 'f-name', 'f-price', 'f-qty');
  document.getElementById('f-name').focus();
  wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function editProduct(p) { showProductForm(p); }

function hideProductForm() {
  document.getElementById('product-form-wrap').classList.add('d-none');
}

function clearFormErrors(...ids) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.classList.remove('is-invalid');
      const fb = document.getElementById('err-' + id.replace('f-', ''));
      if (fb) fb.textContent = '';
    }
  });
}

function setFormError(fieldId, errorId, msg) {
  const el = document.getElementById(fieldId);
  const err = document.getElementById(errorId);
  if (el) el.classList.add('is-invalid');
  if (err) { err.textContent = msg; err.style.display = 'block'; }
}

async function saveProduct() {
  clearFormErrors('f-sku', 'f-name', 'f-price', 'f-qty');
  const id    = document.getElementById('f-id').value;
  const name  = document.getElementById('f-name').value.trim();
  const sku   = document.getElementById('f-sku').value.trim();
  const price = document.getElementById('f-price').value;
  const qty   = document.getElementById('f-qty').value;

  let valid = true;
  if (!name) { setFormError('f-name', 'err-name', 'Product name is required.'); valid = false; }
  if (price !== '' && parseFloat(price) < 0) { setFormError('f-price', 'err-price', 'Price must be non-negative.'); valid = false; }
  if (qty !== '' && parseInt(qty) < 0) { setFormError('f-qty', 'err-qty', 'Quantity must be non-negative.'); valid = false; }
  if (!valid) return;

  const btn = document.querySelector('#product-form-wrap .btn-primary');
  const origText = document.getElementById('pf-save-text').textContent;
  document.getElementById('pf-save-text').textContent = 'Saving…';
  btn.disabled = true;

  try {
    const payload = { name, price: price || '0', quantity: qty || '0' };
    if (sku) payload.sku = sku;
    if (id) {
      await api('PUT', `products?id=${id}`, payload);
      toast('Product updated successfully');
    } else {
      await api('POST', 'products', payload);
      toast('Product created successfully');
    }
    hideProductForm();
    loadProducts();
  } catch(e) {
    toast(e.message, 'error');
    // Try to show inline error
    const msg = e.message.toLowerCase();
    if (msg.includes('sku'))  setFormError('f-sku',  'err-sku',  e.message);
    if (msg.includes('name')) setFormError('f-name', 'err-name', e.message);
  } finally {
    document.getElementById('pf-save-text').textContent = origText;
    btn.disabled = false;
  }
}

async function deleteProduct(id, name) {
  if (!confirm(`Delete "${name}"?\n\nThis cannot be undone.`)) return;
  try {
    await api('DELETE', `products?id=${id}`);
    toast('Product deleted');
    loadProducts();
  } catch(e) {
    toast(e.message, 'error');
  }
}

              <th>SKU</th><th>Product</th>
              <th class="num">Price</th>
              <th class="num">Working</th>
              <th class="num">Faulty</th>
              <th class="num">Total</th>
            </tr></thead>
            <tbody>${invData.map(p => `<tr>
              <td class="sku-cell">${esc(p.sku || '—')}</td>
              <td style="font-weight:500">${esc(p.name)}</td>
              <td class="num">${fmtPrice(p.price)}</td>
              <td class="num"><span class="qty-display ${qtyClass(p.quantity)}">${p.quantity}</span></td>
              <td class="num">${parseInt(p.faulty_quantity) > 0
                ? `<span class="qty-display qty-faulty">${p.faulty_quantity}</span>`
                : `<span style="color:var(--primary-muted);font-family:var(--font-mono)">0</span>`}</td>
              <td class="num font-mono">${p.total}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`;

    const outData = out.data || [];
    document.getElementById('out-table').innerHTML = outData.length === 0
      ? `<div class="empty-state"><div class="empty-state-title">No dispatch records</div></div>`
      : `<div class="table-wrap">
          <table class="data-table">
            <thead><tr>
              <th>Product</th>
              <th class="num">Qty</th>
              <th>Reference / Note</th>
              <th>Date</th>
              <th class="no-print" style="text-align:right">Invoice</th>
            </tr></thead>
            <tbody>${outData.map(m => `<tr>
              <td style="font-weight:500">${esc(m.product)}</td>
              <td class="num">${m.quantity}</td>
              <td style="color:var(--primary-light)">${esc(m.note || '—')}</td>
              <td style="font-family:var(--font-mono);font-size:0.78rem;color:var(--primary-muted)">${fmtDate(m.created_at)}</td>
              <td class="no-print" style="text-align:right">
                <button class="btn btn-ghost btn-sm" onclick="printInvoice(${m.id})">Print</button>
              </td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`;
  } catch(e) {
    toast(e.message, 'error');
    document.getElementById('inv-table').innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
  }
});

    w.document.write(`<!DOCTYPE html><html><head>
      <title>Delivery Note #${id}</title>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
      <style>
        *{box-sizing:border-box}
        body{font-family:'Jost',sans-serif;color:#1C2B3A;padding:48px;max-width:800px;margin:0 auto;font-size:13px}
        h1{font-family:'Fraunces',serif;font-weight:400;font-size:1.8rem;color:#1C2B3A;margin:0 0 4px;letter-spacing:-0.02em}
        .meta{color:#7A91A6;font-size:0.78rem;margin-bottom:32px}
        .doc-id{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:#7A91A6}
        table{width:100%;border-collapse:collapse;margin-top:24px}
        th{font-size:0.68rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
           color:#4A6580;padding:8px 12px;border-bottom:2px solid #DDE1E7;text-align:left}
        th.num,td.num{text-align:right}
        td{padding:8px 12px;border-bottom:1px solid #ECEEF2;color:#1C2B3A}
        td.mono{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:#4A6580}
        .sig-row{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:56px}
        .sig-block{border-top:1px solid #1C2B3A;padding-top:8px;font-size:0.75rem;color:#4A6580}
        .sig-block span{display:block;margin-bottom:24px;font-weight:500;color:#1C2B3A}
        .accent-bar{width:40px;height:3px;background:#2A7F6F;margin-bottom:20px;border-radius:2px}
        .no-print{margin-bottom:24px}
        @media print{.no-print{display:none}}
      </style>
    </head><body>
      <div class="no-print">
        <button onclick="window.print()" style="background:#1C2B3A;color:white;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-family:'Jost',sans-serif;font-size:0.82rem">
          Print Delivery Note
        </button>
      </div>
      <div class="accent-bar"></div>
      <h1>Delivery Note</h1>
      <div class="meta">
        <span class="doc-id">REF: DN-${String(id).padStart(5,'0')}</span><br>
        Date issued: ${r.date}
      </div>
      <table>
        <thead>
          <tr><th>#</th><th>Product</th><th class="num">Qty</th><th>Reference</th><th class="mono">Date</th></tr>
        </thead>
        <tbody>
          ${(r.data || []).map((m, i) => `<tr>
            <td class="mono">${i+1}</td>
            <td style="font-weight:500">${esc(m.product)}</td>
            <td class="num mono">${m.quantity}</td>
            <td style="color:#4A6580">${esc(m.note || '—')}</td>
            <td class="mono">${fmtDate(m.created_at)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="sig-row">
        <div class="sig-block"><span>Received by</span>Signature: ____________________<br>Date: ____________________</div>
        <div class="sig-block"><span>Issued by</span>Signature: ____________________<br>Date: ____________________</div>
      </div>
    </body></html>`);
    w.document.close();
  } catch(e) { toast(e.message, 'error'); }
}

  </div>
  <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start">
    <div class="form-wrap" style="flex:0 0 auto">
      <div class="upload-zone" id="upload-zone" onclick="document.getElementById('import-file').click()">
        <svg width="32" height="32" fill="none" stroke="var(--primary-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="margin-bottom:12px">
          <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>

        <div class="upload-zone-title">Drop file here or click to browse</div>
        <div class="upload-zone-sub" id="upload-filename">Accepts .csv and .xlsx files</div>

          <span id="import-btn-text">Upload and Import</span>

      </div>

    </div>

    <div style="flex:1;min-width:240px">
      <div class="section-divider"><span class="section-label">Expected Format</span></div>
      <div class="card">
        <div class="card-header-custom">Column Reference</div>
        <div class="card-body-custom" style="padding:0">
          <table class="data-table" style="font-size:0.82rem">
            <thead>
              <tr><th>Column</th><th>Required</th><th>Notes</th></tr>
            </thead>
            <tbody>
              <tr>
                <td><code class="mono">name</code></td>
                <td><span class="badge badge-danger">Required</span></td>
                <td style="color:var(--primary-light)">Product name</td>
              </tr>
              <tr>
                <td><code class="mono">sku</code></td>
                <td><span class="badge badge-neutral">Optional</span></td>
                <td style="color:var(--primary-light)">Stock keeping unit identifier</td>
              </tr>
              <tr>
                <td><code class="mono">price</code></td>
                <td><span class="badge badge-neutral">Optional</span></td>
                <td style="color:var(--primary-light)">Unit price (numeric)</td>
              </tr>
              <tr>
                <td><code class="mono">quantity</code></td>
                <td><span class="badge badge-danger">Required</span></td>
                <td style="color:var(--primary-light)">Must be greater than 0</td>
              </tr>

          </table>
        </div>
      </div>
      <div class="mt-3" style="font-size:0.78rem;color:var(--primary-muted);line-height:1.6">
        Existing products matched by SKU or name will have their quantity incremented.
        New products will be created. Rows missing a name or with quantity &le; 0 are skipped.
      </div>
    </div>
  </div>`;

  // Drag-and-drop
  const zone = document.getElementById('upload-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    if (files.length) {
      document.getElementById('import-file').files = files;
      onFileSelected({ files });
    }
  });
});

function onFileSelected(input) {
  const file = input.files[0];
  if (file) {
    document.getElementById('upload-filename').textContent = file.name + ' — ' + (file.size / 1024).toFixed(1) + ' KB';
  }
}

async function doImport() {
  const fileInput = document.getElementById('import-file');
  if (!fileInput?.files[0]) {
    toast('Please select a file first.', 'warning');
    return;
  }

  const btn = document.getElementById('import-btn-text');
  btn.textContent = 'Uploading…';

  const fd = new FormData();
  fd.append('file', fileInput.files[0]);

  try {
    const r = await api('POST', 'import', fd, true);
    document.getElementById('import-result').innerHTML = `
      <div class="card">
        <div class="card-header-custom" style="color:var(--success)">Import Complete</div>
        <div class="card-body-custom">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;text-align:center">
            <div>
              <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:500;color:var(--success)">${r.inserted}</div>
              <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--primary-muted);margin-top:2px">Created</div>
            </div>
            <div>
              <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:500;color:var(--info)">${r.updated}</div>
              <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--primary-muted);margin-top:2px">Updated</div>
            </div>
            <div>
              <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:500;color:var(--warning)">${r.skipped}</div>
              <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--primary-muted);margin-top:2px">Skipped</div>
            </div>
          </div>
        </div>
      </div>`;
    toast(`Import complete: ${r.inserted} created, ${r.updated} updated, ${r.skipped} skipped`);
  } catch(e) {
    document.getElementById('import-result').innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
    toast(e.message, 'error');
  } finally {
    btn.textContent = 'Upload and Import';
  }
}

async function loadMovementLog(targetId, movType) {
  const el = document.getElementById(targetId);
  if (!el) return;

  try {
    const r = await api('GET', `reports?type=movements&mov_type=${movType}&limit=20`);
    const data = r.data || [];

    if (data.length === 0) {
      el.innerHTML = `<div class="empty-state">
        <div class="empty-state-title">No records yet</div>
        <div>Recent ${movType === 'in' ? 'receipts' : 'dispatches'} will appear here.</div>
      </div>`;
      return;
    }

    el.innerHTML = `<div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Product</th><th class="num">Qty</th>
            <th>Reference</th><th>By</th>
            <th style="font-family:var(--font-mono)">Date</th>
          </tr>
        </thead>
        <tbody>${data.map(m => `<tr>
          <td style="font-weight:500">${esc(m.product)}</td>
          <td class="num"><span class="qty-display">${m.quantity}</span></td>
          <td style="color:var(--primary-light)">${esc(m.note || '—')}</td>
          <td style="color:var(--primary-muted);font-size:0.78rem">${esc(m.user || '—')}</td>
          <td style="font-family:var(--font-mono);font-size:0.75rem;color:var(--primary-muted)">${fmtDate(m.created_at)}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
  } catch(e) {
    el.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`;
  }
}

function setFieldError(fieldId, errId, msg) {
  const el = document.getElementById(fieldId);
  const err = document.getElementById(errId);
  if (el) el.classList.add('is-invalid');
  if (err) { err.textContent = msg; err.style.display = 'block'; }
}

function clearFieldError(fieldId) {
  const el = document.getElementById(fieldId);
  if (el) el.classList.remove('is-invalid');
}
